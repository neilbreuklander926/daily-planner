<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A3A5C;--blue:#0078D4;--blue2:#005FA3;--teal:#00A693;
  --bg:#fff;--bgp:#F3F4F6;--bgh:#E5E9ED;
  --text:#1A3A5C;--t2:#4F6A80;--t3:#95A8B8;
  --bd:#DDE3E9;--bd2:#BFC9D3;
  --srow:#fff;--shr:#F7F8FA;--sbd:#EBEEF2;
  --snow:#FFF5F4;--ntxt:#C4382A;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bgp);-webkit-font-smoothing:antialiased;overflow:hidden}
button{cursor:pointer;font-family:inherit;background:none;border:none;color:inherit}
input,textarea{font-family:inherit;color:var(--text)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

#app{padding:14px;height:100vh;display:flex;flex-direction:column;gap:10px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1.5px solid var(--bd2);flex-shrink:0}
.hdr-title{font-family:'Lora',serif;font-size:20px;font-weight:500;color:var(--navy)}
.wnav{display:flex;align-items:center;gap:4px}
.wlbl{font-size:13px;color:var(--t2);min-width:182px;text-align:center;font-weight:500;padding:0 8px}
.nbtn{width:30px;height:30px;border:1.5px solid var(--bd2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:all .12s;color:var(--text)}
.nbtn:hover{background:var(--bgh);border-color:var(--blue)}
.nbtn-wk{background:var(--navy);border-color:var(--navy);color:#fff;font-size:14px}
.nbtn-wk:hover{background:var(--blue2);border-color:var(--blue2)}
.nav-sep{width:1px;height:20px;background:var(--bd2);margin:0 2px}
.tbtn{font-size:12px;padding:5px 12px;border:1.5px solid var(--bd2);border-radius:var(--r);transition:all .12s;color:var(--t2);margin-left:4px}
.tbtn:hover{background:var(--bgh);color:var(--text)}
.sst{font-size:12px;color:var(--t3);min-width:72px;text-align:right}
.sst.sav{color:var(--teal)}.sst.err{color:#c4382a}

/* LAYOUT */
.cols{display:grid;grid-template-columns:195px 1fr 215px;gap:10px;flex:1;min-height:0}
.left{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}

/* MINI CALENDAR */
.cal{background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--rl);overflow:hidden;flex-shrink:0}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;background:var(--navy);color:#fff}
.cal-title{font-size:13px;font-weight:500}
.cal-nav{width:24px;height:24px;border-radius:4px;color:rgba(255,255,255,.8);font-size:20px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer}
.cal-nav:hover{background:rgba(255,255,255,.15)}
.cal-body{padding:8px 5px 6px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.cal-dow span{text-align:center;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.cal-wrow{display:grid;grid-template-columns:repeat(7,1fr);border-radius:5px;overflow:hidden;margin-bottom:1px}
.cal-wrow.sel-wk{background:#DCEcF8}
.cal-d{text-align:center;padding:2px 0;cursor:pointer;font-size:12px;color:var(--t2);border:none;background:transparent}
.cal-d:hover .cdn{background:var(--bgh);color:var(--text)}
.cal-d.om{opacity:.35}
.cdn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;box-shadow:none;text-shadow:none}
.cal-d.is-today .cdn{background:var(--navy);color:#fff;font-weight:700}
.cal-d.is-sel .cdn{background:var(--blue);color:#fff;font-weight:700}
.cal-d.is-today.is-sel .cdn{background:var(--blue);color:#fff}

/* DAY TABS */
.dtabs{background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--rl);overflow:hidden}
.dt-hd{padding:7px 10px;background:var(--bgp);border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase}
.dt-list{padding:4px 5px}
.dtb{width:100%;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t2);transition:background .12s,color .12s;background:transparent;border:none;cursor:pointer;text-shadow:none;box-shadow:none}
.dtb:hover{background:var(--bgh);color:var(--text)}
.dtb.is-td{background:var(--navy);color:#fff;font-weight:600}
.dtb.active{background:var(--blue);color:#fff}
.dt-name{font-weight:500;font-size:12px}
.dt-date{font-size:11px;opacity:.75}

/* WHITEBOARD SECTION */
.wb-sec{background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--rl);overflow:hidden;flex-shrink:0}
.wb-body{padding:8px}
.wb-add{width:100%;padding:8px;border:1.5px dashed var(--bd2);border-radius:6px;color:var(--blue);font-size:12px;text-align:center;cursor:pointer;transition:all .12s;background:transparent;display:flex;align-items:center;justify-content:center;gap:5px}
.wb-add:hover{background:var(--bgh);border-color:var(--blue)}
.wb-row{display:flex;align-items:center}
.wb-item{flex:1;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;transition:background .12s}
.wb-item:hover{background:var(--bgh)}
.wb-nm{font-size:12px;color:var(--text)}
.wb-x{color:var(--t3);font-size:13px;padding:4px 6px;border-radius:3px;transition:all .1s}
.wb-x:hover{color:#c0392b;background:var(--bgh)}

/* SCHEDULE */
.sched{background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--rl);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sched-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;border-bottom:1px solid var(--bd);background:var(--bgp);flex-shrink:0}
.sched-title{font-family:'Lora',serif;font-style:italic;font-size:14px}
.sched-sub{font-size:12px;color:var(--t2)}
.hint{font-size:10px;color:var(--t3);text-align:center;padding:5px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--bgp)}

/* TIME GRID */
.slots-wrap{position:relative;overflow-y:auto;flex:1;min-height:0}
.slot-row{height:36px;display:flex;align-items:center;border-bottom:1px solid var(--sbd);background:var(--srow);cursor:crosshair}
.slot-row.hr{background:var(--shr)}
.slot-row.now{background:var(--snow);position:relative}
.now-arr{font-size:9px;color:var(--ntxt);font-weight:700}
.tl{width:80px;min-width:80px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--t3);text-align:right;padding-right:10px;white-space:nowrap;pointer-events:none;flex-shrink:0}
.slot-row.hr .tl{color:var(--t2);font-weight:500}
.slot-bg{flex:1;height:100%}
.drag-ghost{position:absolute;left:82px;right:4px;background:rgba(0,120,212,.1);border:2px dashed rgba(0,120,212,.35);border-radius:4px;pointer-events:none;z-index:8;display:none}
.cur-line{position:absolute;left:0;right:0;height:2px;background:var(--ntxt);z-index:9;pointer-events:none}
.cur-dot{position:absolute;width:8px;height:8px;background:var(--ntxt);border-radius:50%;z-index:10;pointer-events:none;margin-top:-3px;left:74px}

/* TASK BLOCKS */
.task-block{position:absolute;border-left-width:3px;border-left-style:solid;border-radius:3px;z-index:6;display:flex;flex-direction:column;overflow:visible;cursor:grab;user-select:none;transition:top .08s,left .08s,width .08s}
.task-block:hover{box-shadow:0 1px 8px rgba(0,0,0,.15)}
.task-block.sel{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.task-block.done-blk{opacity:.5}
.task-block.moving{opacity:.82;cursor:grabbing;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.tb-inner{flex:1;display:flex;align-items:flex-start;gap:5px;padding:4px 46px 4px 7px}
.tb-cb{width:13px;height:13px;cursor:pointer;flex-shrink:0;margin-top:3px}
.tb-inp{flex:1;background:transparent;border:none;outline:none;font-size:12px;line-height:1.45;resize:none;padding:0;min-height:16px;width:100%;overflow:hidden;cursor:text}
.tb-inp::placeholder{color:rgba(70,100,130,.65)}
.task-block.sel .tb-inp::placeholder{color:rgba(255,255,255,.8)}
.tb-inp.done-txt{text-decoration:line-through;opacity:.6}
/* Controls top-right */
.tb-btns{position:absolute;top:3px;right:4px;display:flex;align-items:center;gap:2px}
.tb-clr-btn{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);cursor:pointer;flex-shrink:0;transition:transform .1s}
.tb-clr-btn:hover{transform:scale(1.2)}
.tb-del{width:18px;height:18px;font-size:13px;border-radius:3px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;line-height:1;opacity:.7;transition:all .1s}
.tb-del:hover{background:rgba(0,0,0,.1);opacity:1}
.tb-lbl{font-size:10px;opacity:.7;padding:0 8px 3px;font-family:'IBM Plex Mono',monospace;display:none}
.task-block.multi .tb-lbl{display:block}
.tb-resize{position:absolute;bottom:0;left:0;right:0;height:9px;cursor:s-resize;display:flex;align-items:center;justify-content:center;z-index:7}
.tb-resize::before{content:'';width:28px;height:2px;border-radius:1px;opacity:.5}
.tb-resize:hover::before{opacity:1}

/* TASK COLOR PICKER POPOVER */
#task-color-picker{position:fixed;display:none;background:#fff;border:1.5px solid var(--bd2);border-radius:var(--r);padding:8px;z-index:500;box-shadow:0 4px 20px rgba(0,0,0,.15);flex-wrap:wrap;gap:5px;width:162px}
.tcp-swatch{width:36px;height:24px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .1s;display:flex;align-items:center;justify-content:center}
.tcp-swatch:hover{transform:scale(1.08);border-color:rgba(0,0,0,.2)}
.tcp-swatch.active{border-color:rgba(0,0,0,.4)}

/* NOTES */
.notes{background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--rl);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.notes-hdr{padding:10px 13px;border-bottom:1px solid var(--bd);background:var(--bgp);font-family:'Lora',serif;font-style:italic;font-size:14px;flex-shrink:0}
.notes-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.note-add-btn{width:100%;padding:8px;border:1.5px dashed var(--bd2);border-radius:6px;color:var(--blue);font-size:12px;text-align:center;cursor:pointer;transition:all .12s;background:transparent;display:flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.note-add-btn:hover{background:var(--bgh);border-color:var(--blue)}
.note-block{background:var(--bgp);border:1px solid var(--bd);border-radius:6px;overflow:hidden;flex-shrink:0}
.note-ctrl{display:flex;align-items:center;padding:3px 5px;gap:2px;border-bottom:1px solid var(--bd);background:var(--bg)}
.npfx{width:26px;height:22px;border-radius:3px;font-size:11px;font-weight:700;color:var(--t2);display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;transition:all .1s}
.npfx:hover{background:var(--bgh);color:var(--text)}
.npfx.npa{background:var(--blue);color:#fff}
.note-del-btn{margin-left:auto;width:20px;height:20px;border-radius:3px;font-size:11px;color:var(--t3);display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;transition:all .1s}
.note-del-btn:hover{color:#c0392b;background:var(--bgh)}
.note-ta-wrap{display:flex;align-items:flex-start;padding:5px 8px;gap:6px}
.note-ta{flex:1;background:transparent;border:none;outline:none;font-size:12px;line-height:1.65;resize:none;color:var(--text);min-height:28px;width:0}
.note-ta::placeholder{color:var(--t3)}

/* WHITEBOARD */
#wb-overlay{display:none;position:fixed;inset:0;z-index:9999}
#wb-overlay.open{display:block}
#wb-topbar{position:absolute;top:0;left:0;right:0;height:48px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;z-index:12}
#wb-back{font-size:13px;padding:5px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px;color:#fff;cursor:pointer;background:rgba(255,255,255,.1)}
#wb-back:hover{background:rgba(255,255,255,.22)}
#wb-daytitle{font-size:14px;font-family:'Lora',serif;font-style:italic}
#wb-toolbar{position:absolute;top:48px;left:0;right:0;height:44px;background:#1D4A72;display:flex;align-items:center;padding:0 10px;gap:3px;z-index:12;overflow-x:auto}
#wb-canvas-wrap{position:absolute;top:92px;left:0;right:0;bottom:0;background:#fff;overflow:hidden}

/* SHAPE DROPDOWN */
#wb-shape-dd{position:absolute;top:92px;left:0;background:#1D4A72;border:1px solid rgba(255,255,255,.15);border-radius:0 8px 8px 0;padding:10px;z-index:13;display:none;gap:4px;flex-wrap:wrap;width:240px;box-shadow:4px 4px 20px rgba(0,0,0,.3)}
#wb-shape-dd.open{display:flex}
.wbsd-item{width:52px;height:44px;border:1px solid rgba(255,255,255,.15);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.7);font-size:10px;gap:2px;transition:all .12s;background:transparent}
.wbsd-item:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.wbsd-item.act{background:rgba(255,255,255,.25);color:#fff;border-color:rgba(255,255,255,.6)}
.wbsd-item svg{flex-shrink:0}

/* WB TOOLBAR ELEMENTS */
.wbt{height:30px;padding:0 8px;border-radius:4px;font-size:12px;color:rgba(255,255,255,.65);display:flex;align-items:center;gap:3px;transition:all .1s;white-space:nowrap;background:transparent;border:1px solid transparent;cursor:pointer;flex-shrink:0}
.wbt:hover{background:rgba(255,255,255,.12);color:#fff}
.wbt.act{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}
.wb-sep{width:1px;height:22px;background:rgba(255,255,255,.2);margin:0 3px;flex-shrink:0}
.wbclr-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.wbclr-lbl{font-size:10px;color:rgba(255,255,255,.5)}
.wbclr{width:24px;height:24px;border:2px solid rgba(255,255,255,.4);border-radius:4px;cursor:pointer;padding:0;background:none;-webkit-appearance:none}
.wbw{width:26px;height:26px;border-radius:4px;color:rgba(255,255,255,.6);font-size:14px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;cursor:pointer;background:transparent;transition:all .1s}
.wbw:hover{background:rgba(255,255,255,.12);color:#fff}
.wbw.act{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}

/* WB text options (shown when text tool active) */
.wb-txt-opts{display:flex;align-items:center;gap:3px;flex-shrink:0}
select.wb-sel{height:26px;background:#164060;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:4px;font-size:11px;padding:0 4px;cursor:pointer;outline:none}
select.wb-sel option{background:#1D4A72;color:#fff}
.wbtg{width:24px;height:24px;border-radius:4px;color:rgba(255,255,255,.6);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid transparent;cursor:pointer;background:transparent;transition:all .1s}
.wbtg:hover{background:rgba(255,255,255,.12);color:#fff}
.wbtg.act{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}

/* WB fill swatches */
.wb-fill-swatches{display:flex;align-items:center;gap:3px;flex-shrink:0}
.wbfs{width:20px;height:20px;border-radius:3px;border:1.5px solid rgba(255,255,255,.3);cursor:pointer;transition:all .1s;flex-shrink:0}
.wbfs:hover{transform:scale(1.15);border-color:rgba(255,255,255,.8)}
.wbfs.act{border-color:#fff;transform:scale(1.1)}
.wbfs-none{background:transparent;background-image:linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.2) 75%),linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.2) 75%);background-size:8px 8px;background-position:0 0,4px 4px}

/* PREFIX POPUP */
#pfx-popup{position:fixed;display:none;background:var(--bg);border:1.5px solid var(--bd2);border-radius:var(--r);padding:4px;z-index:700;box-shadow:0 4px 18px rgba(0,0,0,.15);flex-direction:column;gap:2px;min-width:115px}
#pfx-popup button{padding:5px 10px;border-radius:4px;text-align:left;font-size:12px;color:var(--text);transition:background .1s;background:transparent;border:none;cursor:pointer}
#pfx-popup button:hover{background:var(--bgh)}
#pfx-popup button.pfx-active{background:var(--blue);color:#fff}
.npfx-icon{width:26px;height:22px;border-radius:3px;font-size:13px;color:var(--t2);display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;transition:all .1s}
.npfx-icon:hover{background:var(--bgh);color:var(--text)}
.npfx-icon.npa{background:var(--blue);color:#fff}

/* TASK DETAILS PANEL */
.det-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.2);flex-shrink:0}
.det-hdr-title{font-family:'Lora',serif;font-style:italic;font-size:14px;color:#fff}
.det-close{color:rgba(255,255,255,.8);font-size:18px;background:transparent;border:none;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .1s;line-height:1}
.det-close:hover{background:rgba(255,255,255,.2);color:#fff}
.det-body{flex:1;overflow-y:auto;padding:12px}
.det-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.06);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--t2);margin-bottom:10px;flex-shrink:0}
.det-dot{width:10px;height:10px;border-radius:50%}
.det-label{font-size:10px;font-weight:700;color:#95A8B8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;margin-top:2px}
.det-task-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3}
.det-time{font-size:12px;color:var(--t2);font-family:'IBM Plex Mono',monospace;margin-bottom:14px}
.det-sep{height:1px;background:var(--bd);margin:10px 0}
.det-ta{width:100%;background:var(--bgp);border:1px solid var(--bd);outline:none;padding:9px;resize:none;font-size:12px;line-height:1.65;min-height:160px;border-radius:6px;color:var(--text);font-family:inherit;transition:border .12s}
.det-ta:focus{border-color:var(--blue);background:var(--bg)}
.det-ta::placeholder{color:var(--t3)}
.det-no-task{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;color:var(--t3);text-align:center;padding:20px}


/* EDIT MODE: textarea not interactive until double-click */
.task-block .tb-inp{pointer-events:none;cursor:default}
.task-block.editing .tb-inp{pointer-events:auto;cursor:text}
/* MULTI-SELECT outline */
.task-block.multi-sel{outline:2.5px solid var(--blue);outline-offset:-2px;z-index:7}
/* RUBBER BAND selection rect */
#rubber-band{position:absolute;border:1.5px solid var(--blue);background:rgba(0,120,212,.07);pointer-events:none;z-index:50;border-radius:2px;display:none}
/* TASK BUFFER: visual gap between stacked tasks via shadow */
.task-block{box-shadow:0 0 0 1.5px var(--bg)}
.task-block:hover,.task-block.sel{box-shadow:0 0 0 1.5px var(--bg),0 2px 10px rgba(0,0,0,.18)}
.task-block.moving{box-shadow:0 0 0 1.5px var(--bg),0 6px 20px rgba(0,0,0,.22)}
/* Multi-select delete panel */
.msel-hdr{padding:10px 13px;border-bottom:1px solid var(--bd);background:var(--bgp);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.msel-title{font-family:'Lora',serif;font-style:italic;font-size:14px}
.msel-del{padding:5px 12px;background:#c4382a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;transition:background .12s}
.msel-del:hover{background:#a82a1e}

/* Slot + add button — replaces time label on hover */
.slot-row{position:relative}

.slot-plus{display:none;width:20px;height:20px;border-radius:50%;background:var(--blue);

<script>
/* ======== CONSTANTS ======== */
const SLOT_H=36, UNIT_H=18, UNITS_TOTAL=76;
const DL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const ROWS=[];
for(let i=0;i<38;i++){
  const t=270+i*30,h=Math.floor(t/60),m=t%60;
  const h12=h>12?h-12:h===0?12:h,ap=h>=12?'PM':'AM';
  ROWS.push({label:`${h12}:${m===0?'00':'30'} ${ap}`,isHour:t%60===0});
}
function unitToStr(u){
  const t=270+u*15,h=Math.floor(t/60),m=t%60;
  const h12=h>12?h-12:h===0?12:h,ap=h>=12?'PM':'AM';
  return`${h12}:${String(m).padStart(2,'0')} ${ap}`;
}

/* Task color palette — Outlook-inspired */
const TC={
  blue:  {bg:'#D6E8F8',bd:'#5A9FD4',acc:'#0078D4',selBg:'#0078D4',txt:'#1A3A5C',stxt:'#fff',res:'rgba(90,159,212,.5)'},
  green: {bg:'#DFF6DD',bd:'#5CAD5A',acc:'#107C10',selBg:'#107C10',txt:'#0A3A0A',stxt:'#fff',res:'rgba(92,173,90,.5)'},
  orange:{bg:'#FCEBD9',bd:'#E08050',acc:'#D83B01',selBg:'#D83B01',txt:'#5A1A00',stxt:'#fff',res:'rgba(224,128,80,.5)'},
  yellow:{bg:'#FEF6D9',bd:'#D4A020',acc:'#FFB900',selBg:'#E6A800',txt:'#4A3200',stxt:'#fff',res:'rgba(212,160,32,.5)'},
  red:   {bg:'#FDE7E9',bd:'#D06060',acc:'#D13438',selBg:'#B52020',txt:'#5A0A0A',stxt:'#fff',res:'rgba(208,96,96,.5)'},
  purple:{bg:'#EDE0F4',bd:'#9060B0',acc:'#5C2D91',selBg:'#4A1F78',txt:'#2A0A50',stxt:'#fff',res:'rgba(144,96,176,.5)'},
  pink:  {bg:'#FDDFF4',bd:'#D070B0',acc:'#E3008C',selBg:'#C0006E',txt:'#5A003A',stxt:'#fff',res:'rgba(208,112,176,.5)'},
};
const TC_KEYS=Object.keys(TC);

/* ======== UTILS ======== */
function getMon(d){const r=new Date(d);r.setHours(0,0,0,0);const dw=r.getDay();r.setDate(r.getDate()-(dw===0?6:dw-1));return r;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function fmt(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtMon(d){return d.toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function wk(m){return`planner_${m.toISOString().slice(0,10)}`;}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function autoResize(el){if(!el)return;el.style.height='auto';el.style.height=el.scrollHeight+'px';}

/* ======== APP STATE ======== */
let monday=getMon(new Date());
let activeDay=(()=>{const d=new Date().getDay();return d===0?6:d-1;})();
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let weekData={};
let saveStatus='saved',saveTimer=null;
let selectedTaskId=null;
let colorPickerTid=null;
let rightPanelMode='notes',detailsTaskId=null,pfxPopupNid=null;

function emptyDay(){return{tasks:[],notes:[]};}
function emptyWeek(){return Object.fromEntries([0,1,2,3,4,5,6].map(i=>[i,emptyDay()]));}
function migrateNotes(raw){
  if(Array.isArray(raw))return raw;
  if(typeof raw==='string'&&raw.trim())return[{id:uid(),prefix:'none',text:raw}];
  return[];
}
function tdIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function isTW(){return sameDay(monday,getMon(new Date()));}
function getCurUnit(){
  if(!isTW()||activeDay!==tdIdx())return -1;
  const nm=new Date().getHours()*60+new Date().getMinutes();
  const u=Math.round((nm-270)/15);
  return(u>=0&&u<UNITS_TOTAL)?u:-1;
}

/* ======== STORAGE ======== */
function loadWeek(){
  // Load from localStorage first (fast)
  try{
    const raw=localStorage.getItem(wk(monday));
    if(raw){
      const p=JSON.parse(raw);const w=emptyWeek();
      for(let d=0;d<7;d++){
        if(!p[d])continue;
        w[d].notes=migrateNotes(p[d].notes);
        if(p[d].tasks){
          w[d].tasks=p[d].tasks.map(t=>{
            if(t.startUnit!==undefined)return{color:'blue',details:'',...t};
            return{color:'blue',details:'',...t,startUnit:(t.startIdx||0)*2,endUnit:(t.endIdx||0)*2+1};
          });
        }
      }
      weekData=w;
    }else weekData=emptyWeek();
  }catch{weekData=emptyWeek();}
  selectedTaskId=null;saveStatus='saved';renderApp();
  // Then fetch from Supabase for each day of the week (overwrites local with server truth)
  if(currentUser){
    for(let di=0;di<7;di++){
      sbLoadDay(addDays(monday,di), di);
    }
  }
}
function doSave(){
  try{localStorage.setItem(wk(monday),JSON.stringify(weekData));saveStatus='saved';}
  catch{saveStatus='error';}
  const el=document.getElementById('sst');
  if(el){el.textContent=saveStatus==='saved'?'\u2713 Saved':'\u2715 Error';el.className='sst '+(saveStatus==='saved'?'sav':'err');}
  // Sync to Supabase in background
  if(currentUser){
    const d=addDays(monday,activeDay);
    sbSyncDay(d, weekData[activeDay]||emptyDay()).catch(function(e){console.warn('Supabase sync:',e);});
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);saveStatus='saving';
  const el=document.getElementById('sst');if(el){el.textContent='\u25cc Saving\u2026';el.className='sst';}
  saveTimer=setTimeout(doSave,700);
}

function createTask(su,eu){

  if(_pendingNewTaskId){
    var prev=weekData[activeDay].tasks.find(function(x){return x.id===_pendingNewTaskId;});

      weekData[activeDay].tasks=weekData[activeDay].tasks.filter(function(x){return x.id!==_pendingNewTaskId;});
      if(selectedTaskId===_pendingNewTaskId)selectedTaskId=null;
    }
    _pendingNewTaskId=null;

  pushHistory();
  var task={id:uid(),startUnit:su,endUnit:eu,text:'',done:false,color:'blue',details:''};
  weekData[activeDay].tasks.push(task);
  _pendingNewTaskId=task.id;
  selectedTaskId=task.id;

/* ── NOTE PREFIX HELPERS ── */
function detectLinePrefix(line){
  const mb=line.match(/^(\s*)(•|◦|▪)\s/);
  if(mb)return{type:'bullet',level:Math.floor(mb[1].length/2),raw:mb[2]};
  const md=line.match(/^(\s*)(–|▪)\s/);
  if(md)return{type:'dash',level:Math.floor(md[1].length/2),raw:md[2]};
  const mn=line.match(/^(\s*)(\d+)\.\s/);
  if(mn)return{type:'number',level:0,num:parseInt(mn[2])};
  const ml=line.match(/^(\s*)([a-z])\.\s/);
  if(ml)return{type:'letter',level:1,num:ml[2],code:ml[2].charCodeAt(0)};
  const mr=line.match(/^(\s*)(i{1,3}|iv|vi{0,3}|ix|xi{0,3})\.\s/i);
  if(mr)return{type:'roman',level:2,num:mr[2].toLowerCase()};
  return null;
}
function nextRoman(r){
  const s=['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii'];
  const i=s.indexOf(r.toLowerCase());return i>=0?s[Math.min(i+1,s.length-1)]:r;
}
function stripPrefix(line){
  return line.replace(/^\s*/,'').replace(/^(•|◦|▪|–|\d+\.|[a-z]\.|i{1,3}|iv|vi{0,3}|ix)\s/i,'');
}
function shiftLineIndent(line,delta){
  const info=detectLinePrefix(line);if(!info)return line;
  const newLv=Math.max(0,Math.min(2,(info.level||0)+delta));
  const indent='  '.repeat(newLv);
  const content=stripPrefix(line);
  let pfx;
  if(info.type==='bullet')pfx=['• ','◦ ','▪ '][newLv];
  else if(info.type==='dash')pfx=['– ','▪ ','• '][newLv];
  else pfx=newLv===0?'1. ':newLv===1?'a. ':'i. ';
  return indent+pfx+content;
}
function transformAllLines(text,newType){
  let counters=[0,0,0];
  return text.split('\n').map(line=>{
    const info=detectLinePrefix(line);
    const lv=info?info.level||0:0;counters[lv]++;
    const indent='  '.repeat(lv);
    const content=info?stripPrefix(line):line;
    let pfx;
    if(newType==='bullet')pfx=['• ','◦ ','▪ '][Math.min(lv,2)];
    else if(newType==='dash')pfx=['– ','▪ ','• '][Math.min(lv,2)];
    else pfx=lv===0?counters[0]+'. ':lv===1?String.fromCharCode(96+counters[1])+'. ':'i. ';
    return indent+pfx+content;
  }).join('\n');
}

function renderNotesBody(){
  const body=document.getElementById('notes-body');if(!body)return;

    // prefix handled inside textarea text only
    return`<div class="note-block" data-nid="${n.id}">
      <div class="note-ctrl">
        <button class="npfx-icon${n.prefix!=='none'?' npa':''}" onmousedown="event.preventDefault()" onclick="openPfxMenu(event,'${n.id}')" title="List style">&#9776;</button>

}

window.noteSetPrefix=function(nid,pfxType){
  const n=weekData[activeDay].notes.find(x=>x.id===nid);
  if(!n)return;
  const isToggleOff=n.prefix===pfxType;
  n.prefix=isToggleOff?'none':pfxType;
  if(!isToggleOff){
    if(!n.text.trim()){
      const pfx=pfxType==='bullet'?'• ':pfxType==='dash'?'– ':'1. ';
      n.text=pfx;
    } else {
      n.text=transformAllLines(n.text,pfxType);
    }

  scheduleSave();
  renderNotesBody();
  setTimeout(()=>{
    const ta2=document.querySelector(`[data-nid="${nid}"] .note-ta`);
    if(ta2){ta2.focus();const l=ta2.value.length;ta2.setSelectionRange(l,l);}

};

function wbGetPos(e){
  const r=WB.canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(WB.canvas.width/r.width),y:(e.clientY-r.top)*(WB.canvas.height/r.height)};
}
function wbRedraw(){
  const{canvas:cv,ctx}=WB;if(!ctx)return;
  ctx.clearRect(0,0,cv.width,cv.height);
  wbDrawBackground(ctx,cv.width,cv.height);
  WB.strokes.forEach(s=>wbDraw(ctx,s));
}
function wbDraw(ctx,s){
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=s.color||'#1A3A5C';ctx.lineWidth=s.lineWidth||2;
  const fill=s.fill&&s.fill!=='none';
  switch(s.type){
    case'pen':case'eraser':{
      if(!s.pts||!s.pts.length)break;
      if(s.type==='eraser'){ctx.strokeStyle='#fff';ctx.lineWidth=(s.lineWidth||2)*8;}
      ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);
      s.pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke();break;
    }
    case'rect':case'square':{
      const x=Math.min(s.x1,s.x2),y=Math.min(s.y1,s.y2),w=Math.abs(s.x2-s.x1),h=Math.abs(s.y2-s.y1);
      if(fill){ctx.fillStyle=s.fill;ctx.fillRect(x,y,w,h);}
      ctx.strokeRect(x,y,w,h);break;
    }
    case'roundedrect':case'roundedsq':{
      const x=Math.min(s.x1,s.x2),y=Math.min(s.y1,s.y2),w=Math.abs(s.x2-s.x1),h=Math.abs(s.y2-s.y1);
      const r=Math.min(12,w/4,h/4);
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
      ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
      ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
      if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'circle':case'ellipse':{
      const cx=(s.x1+s.x2)/2,cy=(s.y1+s.y2)/2,rx=Math.abs(s.x2-s.x1)/2,ry=Math.abs(s.y2-s.y1)/2;
      if(rx<1||ry<1)break;
      ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
      if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'diamond':{
      const cx=(s.x1+s.x2)/2,cy=(s.y1+s.y2)/2,hw=Math.abs(s.x2-s.x1)/2,hh=Math.abs(s.y2-s.y1)/2;
      ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx+hw,cy);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx-hw,cy);ctx.closePath();
      if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'cylinder':{
      const x=Math.min(s.x1,s.x2),y=Math.min(s.y1,s.y2),w=Math.abs(s.x2-s.x1),h=Math.abs(s.y2-s.y1);
      const ry2=Math.min(h*.2,20);
      if(fill){
        ctx.fillStyle=s.fill;
        ctx.fillRect(x,y+ry2,w,h-ry2*2);
        ctx.beginPath();ctx.ellipse(x+w/2,y+ry2,w/2,ry2,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(x+w/2,y+h-ry2,w/2,ry2,0,0,Math.PI*2);ctx.fill();
      }
      ctx.beginPath();ctx.moveTo(x,y+ry2);ctx.lineTo(x,y+h-ry2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+w,y+ry2);ctx.lineTo(x+w,y+h-ry2);ctx.stroke();
      ctx.beginPath();ctx.ellipse(x+w/2,y+h-ry2,w/2,ry2,0,0,Math.PI);ctx.stroke();
      ctx.beginPath();ctx.ellipse(x+w/2,y+ry2,w/2,ry2,0,0,Math.PI*2);ctx.stroke();break;
    }
    case'triangle':{
      const x1=(s.x1+s.x2)/2,y1=Math.min(s.y1,s.y2),x2=Math.min(s.x1,s.x2),y2=Math.max(s.y1,s.y2),x3=Math.max(s.x1,s.x2),y3=y2;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x3,y3);ctx.lineTo(x2,y2);ctx.closePath();
      if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'parallelogram':{
      const x=Math.min(s.x1,s.x2),y=Math.min(s.y1,s.y2),w=Math.abs(s.x2-s.x1),h=Math.abs(s.y2-s.y1),off=w*.2;
      ctx.beginPath();ctx.moveTo(x+off,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-off,y+h);ctx.lineTo(x,y+h);ctx.closePath();
      if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'hexagon':{
      const cx=(s.x1+s.x2)/2,cy=(s.y1+s.y2)/2,rw=Math.abs(s.x2-s.x1)/2,rh=Math.abs(s.y2-s.y1)/2;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);i===0?ctx.moveTo(cx+rw*Math.cos(a),cy+rh*Math.sin(a)):ctx.lineTo(cx+rw*Math.cos(a),cy+rh*Math.sin(a));}
      ctx.closePath();if(fill){ctx.fillStyle=s.fill;ctx.fill();}ctx.stroke();break;
    }
    case'arrow':{
      const dx=s.x2-s.x1,dy=s.y2-s.y1,len=Math.sqrt(dx*dx+dy*dy);if(len<2)break;
      const ang=Math.atan2(dy,dx),hl=Math.max(12,ctx.lineWidth*5);
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s.x2,s.y2);
      ctx.lineTo(s.x2-hl*Math.cos(ang-Math.PI/7),s.y2-hl*Math.sin(ang-Math.PI/7));
      ctx.lineTo(s.x2-hl*Math.cos(ang+Math.PI/7),s.y2-hl*Math.sin(ang+Math.PI/7));
      ctx.closePath();ctx.fillStyle=s.color||'#1A3A5C';ctx.fill();break;
    }
    case'text':{
      if(!s.text)break;
      const style=(s.bold?'bold ':'')+(s.italic?'italic ':'');
      const family=s.font==='serif'?'Georgia,serif':s.font==='mono'?'monospace':'Inter,sans-serif';
      ctx.font=`${style}${s.sz||16}px ${family}`;
      ctx.fillStyle=s.color||'#1A3A5C';ctx.fillText(s.text,s.x,s.y);
      if(s.underline){const m=ctx.measureText(s.text);ctx.fillRect(s.x,s.y+3,m.width,Math.max(1,s.sz/14));}
      break;
    }
  }
  ctx.restore();
}
function wbPush(){WB.history.push(JSON.stringify(WB.strokes));WB.undone=[];if(WB.history.length>80)WB.history.shift();}
function wbUndo(){if(!WB.history.length)return;WB.undone.push(JSON.stringify(WB.strokes));WB.strokes=JSON.parse(WB.history.pop());wbRedraw();}
function wbRedo(){if(!WB.undone.length)return;WB.history.push(JSON.stringify(WB.strokes));WB.strokes=JSON.parse(WB.undone.pop());wbRedraw();}

function wbStartText(x,y){
  if(WB.textInput){WB.textInput.remove();WB.textInput=null;}
  const wrap=document.getElementById('wb-canvas-wrap');
  const r=WB.canvas.getBoundingClientRect();const wr=wrap.getBoundingClientRect();
  const scx=r.width/WB.canvas.width,scy=r.height/WB.canvas.height;
  const px=x*scx+r.left-wr.left,py=y*scy+r.top-wr.top-20;
  const inp=document.createElement('input');inp.type='text';inp.placeholder='Type and press Enter\u2026';
  const sz=WB.textSize;
  inp.style.cssText=`position:absolute;left:${px}px;top:${py}px;border:1.5px dashed #0078D4;background:rgba(255,255,255,.95);color:${WB.color};font-size:${sz}px;font-family:${WB.textFont==='serif'?'Georgia,serif':WB.textFont==='mono'?'monospace':'Inter,sans-serif'};font-weight:${WB.textBold?'bold':'normal'};font-style:${WB.textItalic?'italic':'normal'};text-decoration:${WB.textUnderline?'underline':'none'};outline:none;padding:2px 6px;border-radius:3px;min-width:160px;z-index:50`;
  wrap.appendChild(inp);WB.textInput=inp;
  setTimeout(()=>inp.focus(),10);
  let done=false;
  function commit(){
    if(done)return;done=true;
    const text=inp.value.trim();
    if(text){wbPush();WB.strokes.push({type:'text',x,y,text,sz,color:WB.color,font:WB.textFont,bold:WB.textBold,italic:WB.textItalic,underline:WB.textUnderline});wbRedraw();}
    if(inp.parentNode)inp.remove();WB.textInput=null;
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='Escape'){inp.remove();WB.textInput=null;done=true;}});
  inp.addEventListener('blur',()=>setTimeout(commit,150));
}

function setupWBEvents(canvas){
  function down(e){
    if(e.button!==0)return;
    const{x,y}=wbGetPos(e);
    if(WB.tool==='text'){wbStartText(x,y);return;}
    WB.isDrawing=true;WB.sx=x;WB.sy=y;WB.pts=[[x,y]];e.preventDefault();
  }
  function move(e){
    if(!WB.isDrawing)return;
    const{x,y}=wbGetPos(e);
    if(WB.tool==='pen'||WB.tool==='eraser'){
      WB.pts.push([x,y]);
      wbRedraw();
      if(WB.tool==='pen')wbDraw(WB.ctx,{type:'pen',pts:WB.pts,color:WB.color,lineWidth:WB.lineWidth});
      if(WB.tool==='eraser')wbDraw(WB.ctx,{type:'eraser',pts:WB.pts,color:WB.color,lineWidth:WB.lineWidth});
    }
    else{wbRedraw();wbDraw(WB.ctx,{type:WB.shapeType,x1:WB.sx,y1:WB.sy,x2:x,y2:y,color:WB.color,lineWidth:WB.lineWidth,fill:WB.fillColor});}
    e.preventDefault();
  }
  function up(e){
    if(!WB.isDrawing)return;WB.isDrawing=false;
    const pos=e.type==='mouseleave'?{x:WB.sx,y:WB.sy}:wbGetPos(e);wbPush();
    if(WB.tool==='pen'||WB.tool==='eraser'){if(WB.pts.length)WB.strokes.push({type:WB.tool,pts:[...WB.pts],color:WB.color,lineWidth:WB.lineWidth});}
    else{WB.strokes.push({type:WB.shapeType,x1:WB.sx,y1:WB.sy,x2:pos.x,y2:pos.y,color:WB.color,lineWidth:WB.lineWidth,fill:WB.fillColor});}
    WB.pts=[];wbRedraw();
  }
  canvas.addEventListener('mousedown',down);canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',up);canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();down({button:0,...e.touches[0]});},{passive:false});

/* ── TASK LAYOUT: overlap → columns ── */
function computeTaskLayout(tasks){
  if(!tasks.length)return{};
  var layout={};
  var unitMap={};
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i];
    for(var u=t.startUnit;u<=t.endUnit;u++){
      if(!unitMap[u])unitMap[u]=[];
      unitMap[u].push(t.id);
    }
  }
  // Connected components (overlap clusters)
  var visited={};
  var compOf={};
  var comps=[];
  for(var ti=0;ti<tasks.length;ti++){
    var root=tasks[ti];
    if(visited[root.id])continue;
    var comp=[];
    var queue=[root.id];
    while(queue.length){
      var tid=queue.shift();
      if(visited[tid])continue;
      visited[tid]=true;
      comp.push(tid);
      var tt=null;
      for(var k=0;k<tasks.length;k++){if(tasks[k].id===tid){tt=tasks[k];break;}}
      if(!tt)continue;
      for(var uu=tt.startUnit;uu<=tt.endUnit;uu++){
        var nbrs=unitMap[uu]||[];
        for(var n=0;n<nbrs.length;n++){if(!visited[nbrs[n]])queue.push(nbrs[n]);}
      }
    }
    var ci=comps.length;
    comps.push(comp);
    for(var j=0;j<comp.length;j++)compOf[comp[j]]=ci;
  }
  // Max concurrent per cluster
  var compMaxConc=[];
  for(var ci2=0;ci2<comps.length;ci2++){
    var mx=1;
    var cTids=comps[ci2];
    for(var j2=0;j2<cTids.length;j2++){
      var ct=null;
      for(var k2=0;k2<tasks.length;k2++){if(tasks[k2].id===cTids[j2]){ct=tasks[k2];break;}}
      if(!ct)continue;
      for(var uu2=ct.startUnit;uu2<=ct.endUnit;uu2++){
        if(unitMap[uu2])mx=Math.max(mx,unitMap[uu2].length);
      }
    }
    compMaxConc.push(Math.min(mx,3));
  }
  // Assign columns within each cluster
  var sorted=tasks.slice().sort(function(a,b){
    if(a.startUnit!==b.startUnit)return a.startUnit-b.startUnit;
    return (a.userCol||0)-(b.userCol||0);
  });
  var assigned={};
  for(var ci3=0;ci3<comps.length;ci3++){
    var nc=compMaxConc[ci3];
    var clTids=comps[ci3];
    var cEnd=[];
    var clTasks=sorted.filter(function(t){return clTids.indexOf(t.id)>=0;});
    for(var j3=0;j3<clTasks.length;j3++){
      var t3=clTasks[j3];
      var pref=(typeof t3.userCol==='number')?t3.userCol:null;
      var col=-1;
      if(pref!==null&&pref<nc){
        if(cEnd[pref]===undefined||cEnd[pref]<t3.startUnit)col=pref;
      }
      if(col===-1){
        for(var c2=0;c2<nc;c2++){
          if(cEnd[c2]===undefined||cEnd[c2]<t3.startUnit){col=c2;break;}
        }
      }
      if(col===-1)col=0;
      assigned[t3.id]=col;
      cEnd[col]=Math.max(cEnd[col]||0,t3.endUnit);
    }
  }
  // Compute colSpan: expand task rightward into free adjacent columns
  var colSpan={};
  for(var fi=0;fi<tasks.length;fi++){
    var ft=tasks[fi];
    var fci=compOf[ft.id]||0;
    var fnc=compMaxConc[fci]||1;
    var fcol=assigned[ft.id]||0;
    var span=1;
    // Try to extend into columns to the right
    for(var nextCol=fcol+1;nextCol<fnc;nextCol++){
      var blocked=false;
      var clTids2=comps[fci]||[];
      for(var x=0;x<clTids2.length;x++){
        var ot=null;
        for(var y=0;y<tasks.length;y++){if(tasks[y].id===clTids2[x]){ot=tasks[y];break;}}
        if(!ot||ot.id===ft.id)continue;
        if(assigned[ot.id]===nextCol&&ot.startUnit<=ft.endUnit&&ot.endUnit>=ft.startUnit){
          blocked=true;break;
        }
      }
      if(blocked)break;
      span++;
    }
    colSpan[ft.id]=span;
  }
  // Build final layout
  for(var li=0;li<tasks.length;li++){
    var lt=tasks[li];
    var lci=compOf[lt.id]||0;
    var lnc=compMaxConc[lci]||1;
    layout[lt.id]={col:assigned[lt.id]||0,numCols:lnc,colSpan:colSpan[lt.id]||1};
  }
  return layout;
}


/* helper: column swap on horizontal drag drop */
function swapCols(dragTid,targetCol){
  const t=weekData[activeDay].tasks.find(x=>x.id===dragTid);
  if(!t)return;
  const prevCol=t.userCol||0;
  if(targetCol===prevCol)return;
  // swap overlapping tasks in targetCol back to prevCol
  weekData[activeDay].tasks.forEach(o=>{
    if(o.id===dragTid)return;
    if((o.userCol||0)!==targetCol)return;
    if(o.startUnit<=t.endUnit&&o.endUnit>=t.startUnit)o.userCol=prevCol;
  });
  t.userCol=targetCol;
}

function renderTaskBlocks(dayData){
  var layout=computeTaskLayout(dayData.tasks);
  return dayData.tasks.map(function(t){
    var top=t.startUnit*UNIT_H+1;
    var minH=Math.max(UNIT_H-2,(t.endUnit-t.startUnit+1)*UNIT_H-2);
    var isMulti=t.endUnit-t.startUnit>=2;
    var lbl=isMulti?(unitToStr(t.startUnit)+' \u2013 '+unitToStr(t.endUnit+1)):'';
    var isMSel=selectedTasks.has(t.id)||t.id===selectedTaskId;
    var isEditing=editingTaskId===t.id;
    var col=TC[t.color||'blue']||TC.blue;
    var txtCol=isMSel?col.stxt:col.txt;
    var ly=layout[t.id]||{col:0,numCols:1,colSpan:1};
    var nc=ly.numCols,lc=ly.col,cs=ly.colSpan||1;
    var leftStyle=nc===1?'left:83px;right:4px'
      :'left:calc(83px + '+lc+' * (100% - 87px) / '+nc+' + 1px);width:calc('+cs+' * (100% - 87px) / '+nc+' - 2px);right:auto';
    var bgStyle=isMSel
      ?('background:'+col.selBg+';border-left-color:'+col.acc+';border-color:'+col.tsbg2)
      :('background:'+col.bg+';border-left-color:'+col.acc+';border-color:'+col.bd);
    var selCls=(isMSel?' sel':'')+(selectedTasks.has(t.id)?' multi-sel':'')+(isEditing?' editing':'');
    var parts=[];
    parts.push('<div class="task-block'+(t.done?' done-blk':'')+(isMulti?' multi':'')+selCls+'" data-tid="'+t.id+'" data-col="'+lc+'" data-nc="'+nc+'" data-cs="'+cs+'" style="'+leftStyle+';top:'+top+'px;min-height:'+minH+'px;'+bgStyle+'">');
    parts.push('<div class="tb-inner">');
    parts.push('<input type="checkbox" class="tb-cb" style="accent-color:'+col.acc+'"'+(t.done?' checked':'')+'>');
    parts.push('<textarea class="tb-inp'+(t.done?' done-txt':'')+'" rows="1" style="color:'+txtCol+'" placeholder="Add task\u2026">'+esc(t.text)+'</textarea>');
    parts.push('</div>');
    if(lbl){parts.push('<div class="tb-lbl" style="color:'+txtCol+'">'+lbl+'</div>');}
    parts.push('<div class="tb-btns">');
    parts.push('<button class="tb-clr-btn" data-tid="'+t.id+'" style="background:'+col.acc+'" title="Change color"></button>');
    parts.push('<button class="tb-expand" data-tid="'+t.id+'" title="Open task details" style="color:'+txtCol+';font-size:13px;opacity:.75;background:transparent;border:none;cursor:pointer;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px">&#8599;</button>');
    parts.push('<button class="tb-del" style="color:'+txtCol+'">&times;</button>');
    parts.push('</div>');
    parts.push('<div class="tb-resize"><span style="display:block;width:28px;height:2px;background:'+(isMSel?'rgba(255,255,255,.45)':col.bd)+';border-radius:1px;opacity:.6;margin:0 auto"></span></div>');
    parts.push('<div class="tb-drop-ind"><div class="tb-drop-ind-icon">&#8679;</div><div class="tb-drop-ind-text">Drop to attach</div></div>');
    parts.push('</div>');
    return parts.join('');
  }).join('');
}



function renderSlotRows(){
  var cu=getCurUnit();
  var curRowIdx=cu>=0?Math.floor(cu/2):-1;
  var is30min=(cu>=0&&cu%2===0);
  var lineLeft=is30min?'0':'82px';

  // Build occupancy per row (30-min slot = 2 units)
  var tasks=(weekData[activeDay]&&weekData[activeDay].tasks)||[];
  var rowOcc={};
  for(var ti=0;ti<tasks.length;ti++){
    var t=tasks[ti];
    var rS=Math.floor(t.startUnit/2),rE=Math.floor(t.endUnit/2);
    for(var ri=rS;ri<=rE;ri++) rowOcc[ri]=(rowOcc[ri]||0)+1;
  }

  var rows=ROWS.map(function(r,i){
    var occ=rowOcc[i]||0;
    var canAdd=(occ>=1&&occ<3); // 1 or 2 tasks: show + on hover
    var cls='slot-row'+(i===curRowIdx?' now':r.isHour?' hr':'')+(canAdd?' has-plus':'');
    var arrow=i===curRowIdx?'<span class="now-arr"> &#9664;</span>':'';

    // Time label area — always present, + overlays it on hover
    var tlHTML='<div class="tl-wrap">'
      +'<span class="tl-time">'+r.label+arrow+'</span>'
      +(canAdd?'<button class="slot-plus" onmousedown="event.stopPropagation();event.preventDefault();addTaskAtRow('+i+')" title="Add task here">+</button>':'')
      +'</div>';

    return '<div class="'+cls+'" data-ridx="'+i+'">'+tlHTML+'<div class="slot-bg"></div></div>';
  }).join('');

  var curEl=cu>=0
    ?'<div class="cur-line" style="top:'+(cu*UNIT_H)+'px;left:'+lineLeft+'"></div>'
    :'';
  return rows+curEl;
}


function renderCalendar(){
  const yr=calMonth.getFullYear(),mo=calMonth.getMonth();
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);
  let so=first.getDay();so=so===0?6:so-1;
  const start=addDays(first,-so);
  let eo=last.getDay();eo=eo===0?0:7-eo;
  const end=addDays(last,eo);
  const today=new Date();today.setHours(0,0,0,0);
  const selDate=addDays(monday,activeDay);selDate.setHours(0,0,0,0);
  const days=[];let cur=new Date(start);
  while(cur<=end){days.push(new Date(cur));cur=addDays(cur,1);}
  let html='';
  for(let w=0;w<days.length;w+=7){
    const wd=days.slice(w,w+7),wm=getMon(wd[0]);wm.setHours(0,0,0,0);
    const isSelWk=sameDay(wm,monday);
    const cells=wd.map(d=>{
      const isOM=d.getMonth()!==mo,isTd=sameDay(d,today),isSel=sameDay(d,selDate);
      const ds=d.toISOString().slice(0,10);
      return`<button class="cal-d${isOM?' om':''}${isTd?' is-today':''}${isSel?' is-sel':''}" onclick="calDay('${ds}')"><span class="cdn">${d.getDate()}</span></button>`;
    }).join('');
    html+=`<div class="cal-wrow${isSelWk?' sel-wk':''}">${cells}</div>`;
  }
  return`<div class="cal"><div class="cal-hdr">
    <button class="cal-nav" onclick="calPrev()">\u2039</button>
    <span class="cal-title">${fmtMon(calMonth)}</span>
    <button class="cal-nav" onclick="calNext()">\u203a</button>
  </div><div class="cal-body">
    <div class="cal-dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
    ${html}</div></div>`;
}

/* ======== DRAG STATE ======== */
let _drag={on:false,s:-1,c:-1};
let _move={id:null,on:false,startY:0,startX:0,off:0,dur:0,cur:-1,origCol:0,targetCol:0,numCols:1,groupOffsets:null};
let _rsz={on:false,id:null,initEnd:-1,initY:0};
const MOVE_THRESH=6;
// Edit mode & multi-select
let editingTaskId=null;
let selectedTasks=new Set();
let undoHistory=[],redoStack=[];
let _pendingNewTaskId=null;
let _lastClickTid=null,_lastClickTime=0;
let _rubber={on:false,sx:0,sy:0,sxPx:0,syPx:0};

function getUnit(e){
  const sw=document.getElementById('slots-wrap');if(!sw)return 0;
  const r=sw.getBoundingClientRect();
  const y=e.clientY-r.top+sw.scrollTop;
  return Math.max(0,Math.min(UNITS_TOTAL-1,Math.round(y/UNIT_H)));
}

/* ======== EVENTS ======== */
document.addEventListener('mousedown',e=>{
  const sw=document.getElementById('slots-wrap');

  // --- Color picker ---
  const clrBtn=e.target.closest('.tb-clr-btn');
  if(clrBtn){e.stopPropagation();openColorPicker(clrBtn.dataset.tid,clrBtn);return;}

  // --- Expand to details ---
  const expBtn=e.target.closest('.tb-expand');
  if(expBtn){e.stopPropagation();openDetails(expBtn.dataset.tid);return;}

  // --- Resize ---
  const rh=e.target.closest('.tb-resize');
  if(rh){
    const blk=rh.closest('.task-block');
    if(blk){
      const t=weekData[activeDay].tasks.find(x=>x.id===blk.dataset.tid);
      if(t){_rsz.on=true;_rsz.id=t.id;_rsz.initEnd=t.endUnit;_rsz.initY=e.clientY;e.preventDefault();e.stopPropagation();return;}
    }
  }

  // --- Task block interaction ---
  const blk=e.target.closest('.task-block');
  if(blk&&sw){
    const hardInt=e.target.closest('.tb-cb')||e.target.closest('.tb-del')||
                  e.target.closest('.tb-resize')||e.target.closest('.tb-clr-btn')||e.target.closest('.tb-expand');
    if(hardInt)return; // let checkboxes/buttons work normally

    const isTextArea=e.target.closest('.tb-inp');
    const tid=blk.dataset.tid;
    const isAlreadyEditing=editingTaskId===tid;

    if(isTextArea&&isAlreadyEditing){
      // Already in edit mode on this task - let textarea work
      return;
    }

    // Double-click detection → enter edit mode
    const now=Date.now();
    const isDbl=(_lastClickTid===tid&&now-_lastClickTime<380);
    _lastClickTime=now;_lastClickTid=tid;

    if(isDbl){
      e.preventDefault();
      enterEditMode(tid);
      return;
    }

    // Single click → select/move
    e.preventDefault();
    if(isAlreadyEditing)exitEditMode(); // clicking another area of same task exits edit
    const ae=document.activeElement;
    // Don't blur if we're about to drag the pending empty task
    if(ae instanceof HTMLTextAreaElement||ae instanceof HTMLInputElement){
      if(!(blk&&blk.dataset.tid===_pendingNewTaskId))ae.blur();
    }

    const t=weekData[activeDay].tasks.find(x=>x.id===tid);
    if(t){
      const rect=sw.getBoundingClientRect();
      const y=e.clientY-rect.top+sw.scrollTop;
      const nc=parseInt(blk.dataset.nc)||1;
      _move.id=tid;_move.on=false;_move.startY=e.clientY;_move.startX=e.clientX;
      _move.off=Math.max(0,Math.round(y/UNIT_H)-t.startUnit);
      _move.dur=t.endUnit-t.startUnit;_move.cur=t.startUnit;
      // Record per-task offsets for group drag
      var isGroupDrag=selectedTasks.size>1&&selectedTasks.has(tid);
      if(isGroupDrag){
        _move.groupOffsets={};
        selectedTasks.forEach(function(gid){
          var gt=weekData[activeDay].tasks.find(function(x){return x.id===gid;});
          if(gt)_move.groupOffsets[gid]=gt.startUnit-t.startUnit;
        });
      }else{_move.groupOffsets=null;}
      _move.origCol=t.userCol||0;_move.targetCol=t.userCol||0;_move.numCols=nc;
    }
    return;
  }

  // --- Empty area: rubber band (shift) or drag-create ---
  if(sw&&sw.contains(e.target)&&!e.target.closest('.task-block')){
    exitEditMode();
    if(e.shiftKey){
      // Start rubber band selection
      const rect=sw.getBoundingClientRect();
      _rubber.on=true;
      _rubber.sx=getUnit(e);_rubber.sy=getUnitY(e);
      _rubber.sxPx=e.clientX-rect.left;_rubber.syPx=e.clientY-rect.top+sw.scrollTop;
      e.preventDefault();
    }else{
      clearMultiSelect();
      _drag.on=true;_drag.s=getUnit(e);_drag.c=_drag.s;
      e.preventDefault();
    }
  }
});

document.addEventListener('mousemove',e=>{
  // Drag create
  if(_drag.on){
    _drag.c=getUnit(e);
    const g=document.getElementById('dg');
    if(g){const s=Math.min(_drag.s,_drag.c),en=Math.max(_drag.s,_drag.c);
      g.style.top=(s*UNIT_H)+'px';g.style.height=((en-s+1)*UNIT_H)+'px';g.style.display='block';}
    return;
  }
  // Move task
  if(_move.id){
    const dx=Math.abs(e.clientX-_move.startX),dy=Math.abs(e.clientY-_move.startY);
    if(!_move.on&&(dx>MOVE_THRESH||dy>MOVE_THRESH)){
      _move.on=true;
      const blk=document.querySelector('[data-tid="'+_move.id+'"]');
      if(blk)blk.classList.add('moving');
      // Add moving class to all group tasks at drag start
      if(_move.groupOffsets){
        Object.keys(_move.groupOffsets).forEach(function(gid){
          if(gid===_move.id)return;
          var gb=document.querySelector('[data-tid="'+gid+'"]');
          if(gb)gb.classList.add('moving');
        });
      }
      document.body.style.cursor='grabbing';
    }
    if(_move.on){
      const sw=document.getElementById('slots-wrap');if(!sw)return;
      const rect=sw.getBoundingClientRect();
      // Y snap
      const y=e.clientY-rect.top+sw.scrollTop;
      const ns=Math.max(0,Math.min(UNITS_TOTAL-1-_move.dur,Math.round(y/UNIT_H)-_move.off));
      _move.cur=ns;
      // X column detection
      const taskAreaW=rect.width-87;
      const xInArea=e.clientX-rect.left-83;
      const nc=_move.numCols||1;
      const tc=Math.max(0,Math.min(nc-1,Math.floor(xInArea/(taskAreaW/nc))));
      _move.targetCol=tc;
      const blk=document.querySelector('[data-tid="'+_move.id+'"]');
      if(blk){
        blk.style.top=(ns*UNIT_H+1)+'px';
        if(nc>1){
          var cs2=parseInt(blk.dataset.cs)||1;
          blk.style.left='calc(83px + '+tc+' * (100% - 87px) / '+nc+' + 1px)';
          blk.style.width='calc('+cs2+' * (100% - 87px) / '+nc+' - 2px)';
        }
      }
      // Move all group tasks in sync
      if(_move.groupOffsets){
        Object.keys(_move.groupOffsets).forEach(function(gid){
          if(gid===_move.id)return;
          var off=_move.groupOffsets[gid];
          var gs=Math.max(0,Math.min(UNITS_TOTAL-1,ns+off));
          var gblk=document.querySelector('[data-tid="'+gid+'"]');
          if(gblk){gblk.style.top=(gs*UNIT_H+1)+'px';gblk.classList.add('moving');}
        });
      }
    }
    return;
  }
  // Rubber band
  if(_rubber.on){
    const sw=document.getElementById('slots-wrap');if(!sw)return;
    const rect=sw.getBoundingClientRect();
    const cx=e.clientX-rect.left,cy=e.clientY-rect.top+sw.scrollTop;
    const rb=document.getElementById('rubber-band');
    if(rb){
      const x1=Math.min(_rubber.sxPx,cx),y1=Math.min(_rubber.syPx,cy);
      const x2=Math.max(_rubber.sxPx,cx),y2=Math.max(_rubber.syPx,cy);
      rb.style.cssText='display:block;left:'+x1+'px;top:'+y1+'px;width:'+(x2-x1)+'px;height:'+(y2-y1)+'px';
    }
    return;
  }
  // Resize
  if(_rsz.on){
    const t=weekData[activeDay].tasks.find(x=>x.id===_rsz.id);if(!t)return;
    const ne=Math.max(t.startUnit,Math.min(UNITS_TOTAL-1,_rsz.initEnd+Math.round((e.clientY-_rsz.initY)/UNIT_H)));
    if(ne!==t.endUnit){
      t.endUnit=ne;const blk=document.querySelector('[data-tid="'+_rsz.id+'"]');
      if(blk){
        blk.style.minHeight=((t.endUnit-t.startUnit+1)*UNIT_H-2)+'px';
        const isM=t.endUnit-t.startUnit>=2;blk.classList.toggle('multi',isM);
        const lbl=blk.querySelector('.tb-lbl');
        if(lbl)lbl.textContent=isM?unitToStr(t.startUnit)+' \u2013 '+unitToStr(t.endUnit+1):'';
      }
    }
  }
});

document.addEventListener('mouseup',e=>{
  // Drag create
  if(_drag.on){
    _drag.on=false;const g=document.getElementById('dg');if(g)g.style.display='none';
    // Always create — _drag.on is only set when mousedown was on empty space
    const s=Math.min(_drag.s,_drag.c),en=Math.max(_drag.s,_drag.c);
    createTask(s,s===en?s+1:en);
    return;
  }
  // Move task finish
  if(_move.id){
    document.body.style.cursor='';
    if(_move.on){
      const t=weekData[activeDay].tasks.find(x=>x.id===_move.id);
      if(t){
        if(_move.groupOffsets){
          // Commit all tasks in the group
          pushHistory();
          Object.keys(_move.groupOffsets).forEach(function(gid){
            var off=_move.groupOffsets[gid];
            var gt=weekData[activeDay].tasks.find(function(x){return x.id===gid;});
            if(!gt)return;
            var dur2=gt.endUnit-gt.startUnit; // capture BEFORE mutating
            var ns2=Math.max(0,Math.min(UNITS_TOTAL-1,_move.cur+off));
            gt.startUnit=ns2;gt.endUnit=ns2+dur2;
            var gblk=document.querySelector('[data-tid="'+gid+'"]');
            if(gblk)gblk.classList.remove('moving');
          });
          // Also commit anchor task
          t.startUnit=_move.cur;t.endUnit=_move.cur+_move.dur;
          scheduleSave();
          // Keep multi-selection visible, switch panel back to multi-select view
          // (group stays selected so user can drag again)
        }else{
          t.startUnit=_move.cur;t.endUnit=_move.cur+_move.dur;
          if(_move.targetCol!==_move.origCol){swapCols(_move.id,_move.targetCol);}
          pushHistory();scheduleSave();
          // Switch panel to this task's details
          selectedTaskId=_move.id;
          rightPanelMode='details';detailsTaskId=_move.id;
        }
      }
      const movedTid=_move.id;
      const blk=document.querySelector('[data-tid="'+movedTid+'"]');
      if(blk)blk.classList.remove('moving');
      renderScheduleOnly();
      // Re-focus pending empty task after drag so user can type immediately
      if(_pendingNewTaskId===movedTid){
        var movedT=weekData[activeDay].tasks.find(function(x){return x.id===movedTid;});
        if(movedT&&!movedT.text.trim()){
          setTimeout(function(){
            var ni=document.querySelector('[data-tid="'+movedTid+'"] .tb-inp');
            if(ni){ni.focus();hookPendingBlur(movedTid,ni);openDetails(movedTid);}
          },60);
        }
      }
    }else{
      // Was a click → select
      const tid=_move.id;
      if(e.shiftKey){
        // Preserve any existing single selection when starting multi-select
        if(selectedTaskId&&!selectedTasks.has(selectedTaskId)){
          selectedTasks.add(selectedTaskId);
          selectedTaskId=null;
        }
        if(selectedTasks.has(tid))selectedTasks.delete(tid);
        else selectedTasks.add(tid);
      }else{
        clearMultiSelect();
        selectedTaskId=tid;
        openDetails(tid); // single click always opens details
      }
      renderScheduleOnly();
      updateRightPanel();
    }
    _move.id=null;_move.on=false;return;
  }
  // Rubber band finish
  if(_rubber.on){
    _rubber.on=false;
    const rb=document.getElementById('rubber-band');if(rb)rb.style.display='none';
    const sw=document.getElementById('slots-wrap');if(!sw)return;
    const rect=sw.getBoundingClientRect();
    const cx=e.clientX-rect.left,cy=e.clientY-rect.top+sw.scrollTop;
    const x1=Math.min(_rubber.sxPx,cx),y1=Math.min(_rubber.syPx,cy);
    const x2=Math.max(_rubber.sxPx,cx),y2=Math.max(_rubber.syPx,cy);
    // Select tasks whose block intersects the rect
    // Select tasks whose time AND column both overlap the rubber band
    var uMin=Math.round(y1/UNIT_H),uMax=Math.round(y2/UNIT_H);
    var layout2=computeTaskLayout(weekData[activeDay].tasks);
    var availW=sw.offsetWidth-87;
    weekData[activeDay].tasks.forEach(function(t){
      if(t.startUnit>uMax||t.endUnit<uMin)return; // time miss
      var ly=layout2[t.id]||{col:0,numCols:1,colSpan:1};
      var nc=ly.numCols,lc=ly.col,cs=ly.colSpan||1;
      var tx1=83+lc*availW/nc;
      var tx2=83+(lc+cs)*availW/nc;
      if(tx1<x2&&tx2>x1)selectedTasks.add(t.id); // horizontal overlap
    });
    if(selectedTasks.size>0){selectedTaskId=null;renderScheduleOnly();updateRightPanel();}
    return;
  }
  if(_rsz.on){_rsz.on=false;pushHistory();scheduleSave();_rsz.id=null;}
});

// Auto-delete empty notes on blur (only when focus leaves the note block)
document.addEventListener('blur',e=>{
  if(e.target.classList.contains('note-ta')){
    const blk=e.target.closest('[data-nid]');
    if(blk){
      const rt=e.relatedTarget;
      if(rt&&blk.contains(rt))return; // focus still inside note
      setTimeout(()=>{
        const n=weekData[activeDay].notes.find(x=>x.id===blk.dataset.nid);
        if(n&&!n.text.trim()){
          weekData[activeDay].notes=weekData[activeDay].notes.filter(x=>x.id!==blk.dataset.nid);
          renderNotesBody();
        }
      },250);
    }
  }
},true);

// KEYDOWN: Delete key for tasks + Enter key for notes
document.addEventListener('keydown',e=>{
  const wbOpen=document.getElementById('wb-overlay').classList.contains('open');
  if(wbOpen){
    if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();wbUndo();}
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();wbRedo();}
    return;
  }

  // Escape: clear all selections, close details, return to notes
  if(e.key==='Escape'&&!wbOpen){
    e.preventDefault();
    exitEditMode();
    clearMultiSelect();
    selectedTaskId=null;
    rightPanelMode='notes';
    detailsTaskId=null;
    renderScheduleOnly();
    updateRightPanel();
    return;
  }
  // Ctrl+Z/Y: undo/redo (non-whiteboard)
  if((e.ctrlKey||e.metaKey)&&!wbOpen){
    if(e.key==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
    if(e.key==='y'||(e.key==='z'&&e.shiftKey)){e.preventDefault();redo();return;}
  }
  // Task Enter = finalize (Shift+Enter = new line)
  if(e.key==='Enter'&&!e.shiftKey&&e.target.classList.contains('tb-inp')){
    e.preventDefault();e.target.blur();return;
  }
  // Delete task
  if((e.key==='Delete'||e.key==='Backspace')){
    const ae=document.activeElement;
    if(ae instanceof HTMLTextAreaElement||ae instanceof HTMLInputElement)return;
    if(selectedTasks.size>0||(selectedTaskId&&!editingTaskId)){
      e.preventDefault();deleteSelected();return;
    }
  }

  // Notes: Enter = continue prefix; Tab = shift indent level
  if((e.key==='Enter'||e.key==='Tab')&&e.target.classList.contains('note-ta')){
    e.preventDefault();
    const blk=e.target.closest('[data-nid]');if(!blk)return;
    const n=weekData[activeDay].notes.find(x=>x.id===blk.dataset.nid);if(!n)return;
    const ta=e.target,pos=ta.selectionStart,selEnd=ta.selectionEnd;
    const before=ta.value.substring(0,pos);
    const lineStart=before.lastIndexOf('\n')+1;
    const afterAll=ta.value.substring(pos);
    const lineEndRel=afterAll.indexOf('\n');
    const lineEndPos=lineEndRel===-1?ta.value.length:pos+lineEndRel;
    const curLine=ta.value.substring(lineStart,lineEndPos);
    if(e.key==='Enter'){
      const info=detectLinePrefix(curLine);
      let ins='\n';
      if(info){
        const ind='  '.repeat(info.level||0);
        if(info.type==='bullet')ins='\n'+ind+['• ','◦ ','▪ '][Math.min(info.level||0,2)];
        else if(info.type==='dash')ins='\n'+ind+['– ','▪ ','• '][Math.min(info.level||0,2)];
        else if(info.type==='number')ins='\n'+ind+(info.num+1)+'. ';
        else if(info.type==='letter')ins='\n'+ind+String.fromCharCode(info.code+1)+'. ';
        else if(info.type==='roman')ins='\n'+ind+nextRoman(info.num)+'. ';
      }
      n.text=ta.value.substring(0,pos)+ins+ta.value.substring(selEnd);
      ta.value=n.text;const np=pos+ins.length;ta.setSelectionRange(np,np);
    } else {
      const delta=e.shiftKey?-1:1;
      const newLine=shiftLineIndent(curLine,delta);
      n.text=ta.value.substring(0,lineStart)+newLine+ta.value.substring(lineEndPos);
      const off=Math.max(0,newLine.length-curLine.length);
      ta.value=n.text;
      const np2=Math.max(lineStart,pos+(e.shiftKey?-off:off));
      ta.setSelectionRange(np2,np2);
    }
    autoResize(ta);scheduleSave();
  }
},true);

window.prevWeek=()=>{monday=addDays(monday,-7);loadWeek();};
window.nextWeek=()=>{monday=addDays(monday,7);loadWeek();};

window.nextDay=()=>{cleanupPendingTask();if(activeDay<6){activeDay++;clearHistory();renderApp();}else{monday=addDays(monday,7);activeDay=0;loadWeek();}};

/* ── RIGHT PANEL ── */
function updateRightPanel(){
  const rp=document.getElementById('right-panel');if(!rp)return;
  // Multi-select takes priority
  if(selectedTasks.size>1){
    const tasks=weekData[activeDay].tasks.filter(t=>selectedTasks.has(t.id));
    const items=tasks.map(t=>{
      const col=TC[t.color||'blue']||TC.blue;
      return`<div class="msel-item"><span class="msel-dot" style="background:${col.acc}"></span><span>${esc(t.text)||'<em style="opacity:.5">Untitled</em>'}</span></div>`;
    }).join('');
    rp.innerHTML=`<div class="msel-hdr">
      <span class="msel-title">${tasks.length} tasks selected</span>
      <button class="msel-del" onclick="deleteSelected()">&#128465; Delete all</button>
    </div>
    <div class="msel-body">${items}</div>
    <div class="msel-hint">Shift+click to add/remove &bull; Delete key to remove all</div>`;
    return;
  }
  if(rightPanelMode==='details'&&detailsTaskId){
    rp.innerHTML=buildDetailsPanelHTML();
    const ta=document.getElementById('det-ta');
    if(ta){
      ta.addEventListener('input',function(){
        const t=weekData[activeDay].tasks.find(x=>x.id===detailsTaskId);
        if(t){t.details=this.value;scheduleSave();}
        autoResize(this);
      });
      autoResize(ta);
    }
    // Set time select values
    var dt=detailsTaskId?weekData[activeDay].tasks.find(function(x){return x.id===detailsTaskId;}):null;
    if(dt){
      var ss2=document.getElementById('det-start-sel');
      var es2=document.getElementById('det-end-sel');
      if(ss2)ss2.value=dt.startUnit;
      if(es2)es2.value=dt.endUnit+1;
    }
    // Load attachments for this task
    if(detailsTaskId)setTimeout(function(){renderTaskAttachments(detailsTaskId);},50);
  }else{
    rp.innerHTML='<div class="notes-hdr">Notes</div><div class="notes-body" id="notes-body"></div>';
    renderNotesBody();
  var ar=document.getElementById('app-root');if(ar)ar.style.display='';
  // Load day files once per day, not on every re-render
  if(_dayFilesDay!==activeDay){
    _dayFilesDay=activeDay;
    setTimeout(function(){renderDayFiles(addDays(monday,activeDay));},120);
  }
  }
}

function enterEditMode(tid){

  const blk=document.querySelector('[data-tid="'+tid+'"]');

    blk.classList.add('editing');

function exitEditMode(){
  if(!editingTaskId)return;
  const blk=document.querySelector('[data-tid="'+editingTaskId+'"]');
  if(blk){
    blk.classList.remove('editing');
    const inp=blk.querySelector('.tb-inp');
    if(inp)inp.style.pointerEvents='';
  }
  editingTaskId=null;
}

/* ── MULTI SELECT ── */
function clearMultiSelect(){
  selectedTasks.clear();
  selectedTaskId=null;   // also clear single selection
  rightPanelMode='notes';
  detailsTaskId=null;
  updateRightPanel();
}
function deleteSelected(){
  const toDel=[...selectedTasks];
  if(selectedTaskId)toDel.push(selectedTaskId);
  if(!toDel.length)return;
  pushHistory();weekData[activeDay].tasks=weekData[activeDay].tasks.filter(t=>!toDel.includes(t.id));
  selectedTasks.clear();selectedTaskId=null;
  if(rightPanelMode==='details'&&toDel.includes(detailsTaskId)){
    rightPanelMode='notes';detailsTaskId=null;
  }
  scheduleSave();renderScheduleOnly();updateRightPanel();
}

function getUnitY(e){
  const sw=document.getElementById('slots-wrap');if(!sw)return 0;
  const r=sw.getBoundingClientRect();
  return e.clientY-r.top+sw.scrollTop;
}



/* ── UNDO / REDO ── */
function pushHistory(){
  undoHistory.push(JSON.stringify(weekData[activeDay]));
  if(undoHistory.length>40)undoHistory.shift();
  redoStack=[];
  updateUndoButtons();
}
function undo(){
  if(!undoHistory.length)return;
  redoStack.push(JSON.stringify(weekData[activeDay]));
  weekData[activeDay]=JSON.parse(undoHistory.pop());
  renderScheduleOnly();updateRightPanel();updateUndoButtons();
}
function redo(){
  if(!redoStack.length)return;
  undoHistory.push(JSON.stringify(weekData[activeDay]));
  weekData[activeDay]=JSON.parse(redoStack.pop());
  renderScheduleOnly();updateRightPanel();updateUndoButtons();
}
function updateUndoButtons(){
  var u=document.getElementById('undo-btn');
  var r=document.getElementById('redo-btn');
  if(u)u.disabled=!undoHistory.length;
  if(r)r.disabled=!redoStack.length;
}
function clearHistory(){undoHistory=[];redoStack=[];updateUndoButtons();}



/* ── EMPTY TASK CLEANUP: handles DOM-removal vs real blur ── */
function hookPendingBlur(taskId, inp){
  if(!inp||inp._bhook)return;
  inp._bhook=true;
  inp.addEventListener('blur',function(){
    exitEditMode();
    // Capture synchronously: is this blur from dragging THIS task?
    var isDragging=(_move.id===taskId);
    setTimeout(function(){
      if(_rsz.on)return;
      if(isDragging)return; // blur from drag start — task will be re-focused after drop
      var t=weekData[activeDay].tasks.find(function(x){return x.id===taskId;});
      if(!t)return;
      if(t.text.trim()){
        if(_pendingNewTaskId===taskId)_pendingNewTaskId=null;
        scheduleSave();return;
      }
      // Empty — only delete if textarea is not currently focused (re-render case)
      var cur=document.querySelector('[data-tid="'+taskId+'"] .tb-inp');
      if(cur&&document.activeElement===cur)return;
      // Genuine click-away with no text
      weekData[activeDay].tasks=weekData[activeDay].tasks.filter(function(x){return x.id!==taskId;});
      if(selectedTaskId===taskId)selectedTaskId=null;
      selectedTasks.delete(taskId);
      if(_pendingNewTaskId===taskId)_pendingNewTaskId=null;
      renderScheduleOnly();
    },250);
  },{once:true});
}


function cleanupPendingTask(){
  if(!_pendingNewTaskId)return;
  var prev=weekData[activeDay]&&weekData[activeDay].tasks.find(function(x){return x.id===_pendingNewTaskId;});
  if(prev&&!prev.text.trim()){
    weekData[activeDay].tasks=weekData[activeDay].tasks.filter(function(x){return x.id!==_pendingNewTaskId;});
    if(selectedTaskId===_pendingNewTaskId)selectedTaskId=null;
    if(selectedTasks)selectedTasks.delete(_pendingNewTaskId);
  }
  _pendingNewTaskId=null;
}

/* ── SUPABASE DATA SYNC ── */
async function sbLoadDay(date, dayIdx){
  if(!currentUser)return;
  var sb=getSB();
  var ds=date.toISOString().slice(0,10);
  // Load tasks
  var {data:tasks}=await sb.from('tasks').select('*').eq('user_id',currentUser.id).eq('date',ds);
  // Load notes
  var {data:notesRow}=await sb.from('day_notes').select('notes').eq('user_id',currentUser.id).eq('date',ds).maybeSingle();
  if(tasks||notesRow){
    if(!weekData[dayIdx])weekData[dayIdx]=emptyDay();
    if(tasks&&tasks.length>0){
      weekData[dayIdx].tasks=tasks.map(function(t){
        return{id:t.id,startUnit:t.start_unit,endUnit:t.end_unit,text:t.text,done:t.done,color:t.color,details:t.details,userCol:t.user_col};
      });
    }
    if(notesRow)weekData[dayIdx].notes=notesRow.notes||[];
    // Refresh if viewing this day
    if(dayIdx===activeDay){renderScheduleOnly();updateRightPanel();}
  }
  // Also load whiteboard
  var {data:wb}=await sb.from('whiteboards').select('strokes').eq('user_id',currentUser.id).eq('date',ds).maybeSingle();
  if(wb&&wb.strokes&&wb.strokes.length){
    localStorage.setItem('wb_'+ds,JSON.stringify(wb.strokes));
    if(dayIdx===activeDay){
      var leftEl=document.querySelector('.left');
      if(leftEl)leftEl.innerHTML=renderCalendar()+renderDayTabs()+renderWBSection();
    }
  }
}

async function sbSyncDay(date, dayData){
  if(!currentUser)return;
  var sb=getSB();
  var ds=date.toISOString().slice(0,10);
  var uid=currentUser.id;
  // Sync tasks: upsert all, delete removed ones
  var tasks=(dayData.tasks||[]).map(function(t){
    return{id:t.id,user_id:uid,date:ds,start_unit:t.startUnit,end_unit:t.endUnit,
      text:t.text||'',done:!!t.done,color:t.color||'blue',details:t.details||'',user_col:t.userCol||0,updated_at:new Date().toISOString()};
  });
  // Get existing task IDs for this day to detect deletions
  var {data:existing}=await sb.from('tasks').select('id').eq('user_id',uid).eq('date',ds);
  var existingIds=new Set((existing||[]).map(function(r){return r.id;}));
  var currentIds=new Set(tasks.map(function(t){return t.id;}));
  // Delete removed
  var toDelete=[...existingIds].filter(function(id){return!currentIds.has(id);});
  if(toDelete.length)await sb.from('tasks').delete().in('id',toDelete);
  // Upsert current
  if(tasks.length)await sb.from('tasks').upsert(tasks,{onConflict:'id'});
  // Sync notes
  if(dayData.notes!==undefined){
    await sb.from('day_notes').upsert({user_id:uid,date:ds,notes:dayData.notes||[],updated_at:new Date().toISOString()},{onConflict:'user_id,date'});
  }
}

async function sbSyncWhiteboard(ds, strokes){
  if(!currentUser)return;
  await getSB().from('whiteboards').upsert({user_id:currentUser.id,date:ds,strokes:strokes,updated_at:new Date().toISOString()},{onConflict:'user_id,date'});
}

}

/* ── FILE ATTACHMENTS ── */
async function uploadAttachment(file, date, taskId){
  if(!currentUser){alert('Sign in to upload files.');return null;}
  var sb=getSB();
  var ds=date.toISOString().slice(0,10);
  var ext=file.name.split('.').pop();
  var path=currentUser.id+'/'+ds+'/'+(taskId||'day')+'/'+Date.now()+'.'+ext;
  var {error:upErr}=await sb.storage.from('planner-files').upload(path,file);
  if(upErr){alert('Upload error: '+upErr.message);return null;}
  var type=file.type.startsWith('image/')?'image':'file';
  var {data,error}=await sb.from('attachments').insert({
    user_id:currentUser.id,date:ds,task_id:taskId||null,
    type:type,name:file.name,storage_path:path,size_bytes:file.size,mime_type:file.type
  }).select().single();
  if(error){alert('DB error: '+error.message);return null;}
  return data;
}

async function getAttachmentUrl(storagePath){
  if(!storagePath)return null;
  var {data}=await getSB().storage.from('planner-files').createSignedUrl(storagePath,3600);
  return data?data.signedUrl:null;
}

async function deleteAttachment(id, storagePath){
  if(!currentUser)return;
  var sb=getSB();
  await sb.from('attachments').delete().eq('id',id);
  if(storagePath)await sb.storage.from('planner-files').remove([storagePath]);
}

async function fetchAttachments(date, taskId){
  if(!currentUser)return[];
  var ds=date.toISOString().slice(0,10);
  var q=getSB().from('attachments').select('*').eq('user_id',currentUser.id).eq('date',ds);
  if(taskId)q=q.eq('task_id',taskId);
  else q=q.is('task_id',null);
  var {data}=await q.order('created_at',{ascending:false});
  return data||[];
}

  var el=document.getElementById('day-files-body');

  if(!currentUser){el.innerHTML='<div style="font-size:12px;color:#95A8B8;padding:4px">Sign in to attach files.</div>';return;}
  var atts=await fetchAttachments(date,null);

    if(!inp.files||!inp.files[0])return;

function dbSortHeader(label,colKey){
  var arrow=_dbSort.col===colKey?(_dbSort.dir==='asc'?'&#9650;':'&#9660;'):'&#8693;';
  return '<th onclick="dbSortBy(\''+colKey+'\')" style="cursor:pointer;user-select:none;white-space:nowrap">'+label+' <span style="font-size:10px;color:#95A8B8">'+arrow+'</span></th>';
}
window.dbSortBy=function(col){
  if(_dbSort.col===col)_dbSort.dir=_dbSort.dir==='asc'?'desc':'asc';
  else{_dbSort.col=col;_dbSort.dir='asc';}
  window['re'+_dbTab+'DB']();
};

function applySearchSortFilter(rows,cols){
  var q=_dbSearch.toLowerCase();
  if(q){rows=rows.filter(function(r){return cols.some(function(c){var v=c.val(r)||'';return v.toString().toLowerCase().includes(q);});});}
  Object.keys(_dbFilters).forEach(function(k){
    if(!_dbFilters[k])return;
    var col=cols.find(function(c){return c.key===k;});
    if(!col)return;
    rows=rows.filter(function(r){return (col.val(r)||'')===_dbFilters[k];});
  });
  if(_dbSort.col){
    var sc=_dbSort.col,sd=_dbSort.dir;
    var sc_col=cols.find(function(c){return c.key===sc;});
    if(sc_col)rows=rows.slice().sort(function(a,b){
      var av=sc_col.val(a)||'',bv=sc_col.val(b)||'';
      return sd==='asc'?(av>bv?1:av<bv?-1:0):(av<bv?1:av>bv?-1:0);
    });
  }
  return rows;
}

window.dbToggleDone=async function(taskId,date){
  if(!currentUser)return;
  var row=_dbData.find(function(r){return r.id===taskId;});
  if(!row)return;
  row.done=!row.done;
  await getSB().from('tasks').update({done:row.done}).eq('id',taskId);
  // If viewing this day, also update weekData
  if(date===addDays(monday,activeDay).toISOString().slice(0,10)){
    var t=weekData[activeDay].tasks.find(function(x){return x.id===taskId;});
    if(t){t.done=row.done;renderScheduleOnly();}
  }
  renderDBTasks();
};
window.dbChangeColor=async function(taskId,date,color){
  if(!currentUser)return;
  var row=_dbData.find(function(r){return r.id===taskId;});
  if(row)row.color=color;
  await getSB().from('tasks').update({color:color}).eq('id',taskId);
  if(date===addDays(monday,activeDay).toISOString().slice(0,10)){
    var t=weekData[activeDay].tasks.find(function(x){return x.id===taskId;});
    if(t){t.color=color;renderScheduleOnly();}
  }
  renderDBTasks();
};
window.dbUpdateTask=async function(taskId,date,field,value){
  if(!currentUser||!value)return;
  var row=_dbData.find(function(r){return r.id===taskId;});
  if(row)row[field]=value;
  var update={};update[field]=value;
  await getSB().from('tasks').update(update).eq('id',taskId);
  if(date===addDays(monday,activeDay).toISOString().slice(0,10)){
    var t=weekData[activeDay].tasks.find(function(x){return x.id===taskId;});
    if(t){t[field]=value;renderScheduleOnly();}
  }
};

  var {data}=await getSB().from('attachments').select('*').eq('task_id',taskId);
  var atts=data||[];
  var body=document.getElementById('db-body');if(!body)return;

/* ── Export to CSV ── */
window.exportDB=function(){
  var rows=_dbData;
  if(!rows.length)return;
  var keys=Object.keys(rows[0]).filter(function(k){return k!=='user_id';});
  var csv=keys.join(',')+'\n'+rows.map(function(r){
    return keys.map(function(k){
      var v=r[k];
      if(v===null||v===undefined)return '';
      if(typeof v==='object')return '"'+JSON.stringify(v).replace(/"/g,'""')+'"';
      return '"'+String(v).replace(/"/g,'""')+'"';
    }).join(',');
  }).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=_dbTab+'_export.csv';a.click();
  URL.revokeObjectURL(url);
};

function wbDrawBackground(ctx,w,h){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  if(WB.bg==='grid'){
    var step=30;
    ctx.save();ctx.strokeStyle='rgba(0,100,212,0.12)';ctx.lineWidth=0.8;
    ctx.beginPath();
    for(var x=step;x<w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,h);}
    for(var y=step;y<h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y);}
    ctx.stroke();ctx.restore();
  }else if(WB.bg==='dots'){
    var stepD=30;
    ctx.save();ctx.fillStyle='rgba(0,100,212,0.3)';
    for(var xd=stepD;xd<w;xd+=stepD){
      for(var yd=stepD;yd<h;yd+=stepD){
        ctx.beginPath();ctx.arc(xd,yd,1.5,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.restore();
  }
}

function detUnitToTimeInput(unit){
  var totalMins=4*60+30+unit*15;
  var h=Math.floor(totalMins/60)%24;
  var m=totalMins%60;
  return(h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function detTimeInputToUnit(val){
  var parts=val.split(':');
  var h=parseInt(parts[0]),m=parseInt(parts[1]);
  var totalMins=h*60+m;
  var baseMins=4*60+30;
  return Math.max(0,Math.min(UNITS_TOTAL-1,Math.round((totalMins-baseMins)/15)));
}

window.detUpdateTime=function(){

  if(!t)return;
  var ss=document.getElementById('det-start-sel');
  var es=document.getElementById('det-end-sel');
  if(!ss||!es)return;
  var newStart=parseInt(ss.value);
  var newEnd=parseInt(es.value)-1;
  if(newEnd<newStart)newEnd=newStart;
  pushHistory();t.startUnit=newStart;t.endUnit=newEnd;
  scheduleSave();renderScheduleOnly();
};
